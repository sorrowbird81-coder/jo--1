<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Momentum Board</title>
<meta name="theme-color" content="#0B1220" />
<meta name="description" content="Nifty 50, Bank Nifty and Nifty 200 daily momentum board" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Momentum" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; background: #0B1220; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #263047; border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback } = React;

// ---------- icons (inline, no external icon lib needed) ----------
const Icon = ({ children, size = 14 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
);
const TrendingUp = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></Icon>;
const TrendingDown = (p) => <Icon {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></Icon>;
const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Icon>;
const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></Icon>;
const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></Icon>;

// ---------- helpers ----------
const fmt = (n, d = 2) =>
  n === null || n === undefined || Number.isNaN(n)
    ? "—"
    : n.toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });

const pctChange = (prev, ltp) => (prev ? ((ltp - prev) / prev) * 100 : 0);

function seeded(seed) {
  let s = seed;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

const SAMPLE_SYMBOLS = [
  "RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "HINDUNILVR", "SBIN",
  "BHARTIARTL", "ITC", "KOTAKBANK", "LT", "AXISBANK", "BAJFINANCE", "ASIANPAINT",
  "MARUTI", "SUNPHARMA", "TITAN", "ULTRACEMCO", "WIPRO", "NESTLEIND", "TATAMOTORS",
  "TATASTEEL", "POWERGRID", "NTPC", "ADANIENT", "ADANIPORTS", "HCLTECH", "ONGC",
  "JSWSTEEL", "GRASIM", "CIPLA", "DRREDDY", "EICHERMOT", "BAJAJFINSV", "HEROMOTOCO",
  "BRITANNIA", "DIVISLAB", "COALINDIA", "SHREECEM", "UPL",
];

function buildSampleStocks() {
  const rnd = seeded(42);
  return SAMPLE_SYMBOLS.map((sym) => {
    const prevClose = Math.round((500 + rnd() * 3500) * 100) / 100;
    const drift = (rnd() - 0.45) * 0.06;
    const ltp = Math.round(prevClose * (1 + drift) * 100) / 100;
    return { symbol: sym, prevClose, ltp };
  });
}

const FLAP_CHARS = (s) => String(s).split("");

function FlapPrice({ value }) {
  return (
    <div className="flex gap-[3px]">
      {FLAP_CHARS(value).map((ch, i) => (
        <div key={i}
          className={
            ch === "." || ch === ","
              ? "flex items-end justify-center w-2 pb-1 text-[#E8ECF4]"
              : "flex items-center justify-center w-7 h-10 rounded-[3px] bg-[#0B1220] border border-white/10 text-[#F4E7B9] text-xl font-mono relative overflow-hidden shadow-[inset_0_1px_0_rgba(255,255,255,0.05)]"
          }>
          {ch}
          {ch !== "." && ch !== "," && <div className="absolute left-0 right-0 top-1/2 h-px bg-black/40" />}
        </div>
      ))}
    </div>
  );
}

function IndexCard({ label, sub, prevClose, ltp, onChangePrev, onChangeLtp }) {
  const change = ltp - prevClose;
  const pct = pctChange(prevClose, ltp);
  const up = change >= 0;
  return (
    <div className="flex-1 min-w-[260px] rounded-lg border border-white/10 bg-[#121B2E] p-5">
      <div className="flex items-baseline justify-between mb-4">
        <div>
          <div className="text-[11px] tracking-[0.18em] text-[#8A93A6] font-sans uppercase">{sub}</div>
          <div className="text-lg font-semibold text-[#E8ECF4] font-sans">{label}</div>
        </div>
        <div className={"flex items-center gap-1 text-sm font-mono px-2 py-1 rounded " + (up ? "bg-[#22C55E]/10 text-[#22C55E]" : "bg-[#EF4444]/10 text-[#EF4444]")}>
          {up ? <TrendingUp size={14} /> : <TrendingDown size={14} />}
          {up ? "+" : ""}{fmt(pct)}%
        </div>
      </div>
      <FlapPrice value={fmt(ltp)} />
      <div className="flex items-center gap-3 mt-3 text-xs font-mono">
        <span className={up ? "text-[#22C55E]" : "text-[#EF4444]"}>{up ? "+" : ""}{fmt(change)}</span>
        <span className="text-[#8A93A6]">today</span>
      </div>
      <div className="flex gap-4 mt-4 pt-4 border-t border-white/5">
        <label className="flex flex-col gap-1 text-[11px] text-[#8A93A6] font-sans uppercase tracking-wide">
          Prev close
          <input type="number" value={prevClose}
            onChange={(e) => onChangePrev(parseFloat(e.target.value) || 0)}
            className="bg-[#0B1220] border border-white/10 rounded px-2 py-1 text-[#E8ECF4] font-mono text-sm w-28 focus:outline-none focus:ring-1 focus:ring-[#D4A72C]" />
        </label>
        <label className="flex flex-col gap-1 text-[11px] text-[#8A93A6] font-sans uppercase tracking-wide">
          LTP
          <input type="number" value={ltp}
            onChange={(e) => onChangeLtp(parseFloat(e.target.value) || 0)}
            className="bg-[#0B1220] border border-white/10 rounded px-2 py-1 text-[#E8ECF4] font-mono text-sm w-28 focus:outline-none focus:ring-1 focus:ring-[#D4A72C]" />
        </label>
      </div>
    </div>
  );
}

function MomentumBar({ pct, maxAbs }) {
  const width = maxAbs ? Math.min(Math.abs(pct) / maxAbs, 1) * 100 : 0;
  const up = pct >= 0;
  return (
    <div className="w-full h-1.5 bg-white/5 rounded overflow-hidden">
      <div className={"h-full rounded " + (up ? "bg-[#22C55E]" : "bg-[#EF4444]")}
        style={{ width: `${width}%`, marginLeft: up ? "50%" : `${50 - width}%` }} />
    </div>
  );
}

function MomentumBoard() {
  const [nifty, setNifty] = useState({ prevClose: 24600, ltp: 24750 });
  const [bankNifty, setBankNifty] = useState({ prevClose: 51000, ltp: 50820 });
  const [stocks, setStocks] = useState(() => buildSampleStocks());
  const [isSample, setIsSample] = useState(true);
  const [filter, setFilter] = useState("all");
  const [query, setQuery] = useState("");
  const [fileError, setFileError] = useState("");

  const handleFile = useCallback((file) => {
    if (!file) return;
    setFileError("");
    Papa.parse(file, {
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: (res) => {
        try {
          const rows = res.data.map((row) => {
            const keys = Object.keys(row).reduce((acc, k) => {
              acc[k.trim().toLowerCase()] = row[k];
              return acc;
            }, {});
            const symbol = keys.symbol ?? keys.sym ?? keys.name;
            const prevClose = Number(keys.prevclose ?? keys.prev_close ?? keys.previousclose);
            const ltp = Number(keys.ltp ?? keys.close ?? keys.last ?? keys.cmp);
            if (!symbol || !isFinite(prevClose) || !isFinite(ltp) || prevClose <= 0) return null;
            return { symbol: String(symbol).toUpperCase(), prevClose, ltp };
          }).filter(Boolean);
          if (rows.length === 0) {
            setFileError("No valid rows found. Expect columns: Symbol, PrevClose, LTP.");
            return;
          }
          setStocks(rows);
          setIsSample(false);
        } catch (e) {
          setFileError("Couldn't read that file. Expect columns: Symbol, PrevClose, LTP.");
        }
      },
      error: () => setFileError("Couldn't parse that file."),
    });
  }, []);

  const loadSample = () => {
    setStocks(buildSampleStocks());
    setIsSample(true);
    setFileError("");
  };

  const enriched = useMemo(() => {
    return stocks
      .map((s) => ({ ...s, change: s.ltp - s.prevClose, pct: pctChange(s.prevClose, s.ltp) }))
      .filter((s) => s.symbol.toLowerCase().includes(query.trim().toLowerCase()));
  }, [stocks, query]);

  const maxAbsPct = useMemo(() => Math.max(1, ...enriched.map((s) => Math.abs(s.pct))), [enriched]);

  const filtered = useMemo(() => {
    let list = [...enriched];
    if (filter === "gainers") list = list.filter((s) => s.pct > 0).sort((a, b) => b.pct - a.pct);
    else if (filter === "losers") list = list.filter((s) => s.pct < 0).sort((a, b) => a.pct - b.pct);
    else list = list.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));
    return list;
  }, [enriched, filter]);

  const gainersCount = enriched.filter((s) => s.pct > 0).length;
  const losersCount = enriched.filter((s) => s.pct < 0).length;

  return (
    <div className="min-h-screen bg-[#0B1220] text-[#E8ECF4] px-4 py-8 sm:px-8" style={{fontFamily: "system-ui, -apple-system, sans-serif"}}>
      <div className="max-w-5xl mx-auto">
        <div className="mb-8">
          <div className="text-[11px] tracking-[0.25em] text-[#D4A72C] uppercase font-mono mb-1">NSE · Daily Momentum</div>
          <h1 className="text-3xl font-semibold text-[#E8ECF4]">Momentum Board</h1>
          <p className="text-sm text-[#8A93A6] mt-1 max-w-xl">Track Nifty 50, Bank Nifty, and your Nifty 200 universe — ranked by today's move against previous close.</p>
        </div>

        <div className="flex flex-wrap gap-4 mb-10">
          <IndexCard label="NIFTY 50" sub="Index" prevClose={nifty.prevClose} ltp={nifty.ltp}
            onChangePrev={(v) => setNifty((n) => ({ ...n, prevClose: v }))}
            onChangeLtp={(v) => setNifty((n) => ({ ...n, ltp: v }))} />
          <IndexCard label="BANK NIFTY" sub="Index" prevClose={bankNifty.prevClose} ltp={bankNifty.ltp}
            onChangePrev={(v) => setBankNifty((n) => ({ ...n, prevClose: v }))}
            onChangeLtp={(v) => setBankNifty((n) => ({ ...n, ltp: v }))} />
        </div>

        <div className="rounded-lg border border-white/10 bg-[#121B2E] p-5 mb-6">
          <div className="flex flex-wrap items-center gap-3 justify-between mb-1">
            <div>
              <div className="text-[11px] tracking-[0.18em] text-[#8A93A6] uppercase">Stock universe</div>
              <div className="text-sm text-[#E8ECF4] font-mono">{stocks.length} symbols {isSample && <span className="text-[#D4A72C]">· sample data</span>}</div>
            </div>
            <div className="flex gap-2">
              <label className="flex items-center gap-2 text-sm bg-[#0B1220] border border-white/10 rounded px-3 py-2 cursor-pointer hover:border-[#D4A72C]/50 transition-colors">
                <Upload size={14} />Upload CSV
                <input type="file" accept=".csv" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
              </label>
              <button onClick={loadSample} className="flex items-center gap-2 text-sm bg-[#0B1220] border border-white/10 rounded px-3 py-2 hover:border-[#D4A72C]/50 transition-colors">
                <RotateCcw size={14} />Sample data
              </button>
            </div>
          </div>
          {fileError && <div className="text-xs text-[#EF4444] mt-2">{fileError}</div>}
          <div className="flex items-start gap-2 text-xs text-[#8A93A6] mt-3 pt-3 border-t border-white/5">
            <Info size={13} />
            <span>CSV columns expected: <span className="font-mono text-[#B9C2D0]">Symbol, PrevClose, LTP</span>. This app has no live market feed — export end-of-day prices from your broker or NSE and drop the file here.</span>
          </div>
        </div>

        <div className="flex flex-wrap items-center gap-3 mb-4">
          <div className="flex bg-[#121B2E] border border-white/10 rounded-lg p-1">
            {[{ key: "all", label: "All", count: enriched.length },
              { key: "gainers", label: "Gainers", count: gainersCount },
              { key: "losers", label: "Losers", count: losersCount }].map((t) => (
              <button key={t.key} onClick={() => setFilter(t.key)}
                className={"px-3 py-1.5 rounded text-sm font-mono transition-colors " + (filter === t.key ? "bg-[#D4A72C] text-[#0B1220] font-semibold" : "text-[#8A93A6] hover:text-[#E8ECF4]")}>
                {t.label} <span className="opacity-70">{t.count}</span>
              </button>
            ))}
          </div>
          <div className="flex items-center gap-2 bg-[#121B2E] border border-white/10 rounded-lg px-3 py-1.5 flex-1 min-w-[180px]">
            <Search size={14} />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search symbol"
              className="bg-transparent outline-none text-sm text-[#E8ECF4] placeholder:text-[#5A6478] w-full font-mono" />
          </div>
        </div>

        <div className="rounded-lg border border-white/10 bg-[#121B2E] overflow-hidden">
          <div className="grid grid-cols-[2.5rem_1fr_5.5rem_5.5rem_5.5rem_6rem] gap-2 px-4 py-2 text-[10px] tracking-[0.15em] uppercase text-[#8A93A6] border-b border-white/10">
            <span>#</span><span>Symbol</span><span className="text-right">Prev</span><span className="text-right">LTP</span><span className="text-right">Chg</span><span className="text-right">Momentum</span>
          </div>
          {filtered.length === 0 ? (
            <div className="px-4 py-10 text-center text-sm text-[#8A93A6]">No symbols match. Try a different search or filter.</div>
          ) : filtered.map((s, i) => {
            const up = s.pct >= 0;
            return (
              <div key={s.symbol} className="grid grid-cols-[2.5rem_1fr_5.5rem_5.5rem_5.5rem_6rem] gap-2 px-4 py-2.5 items-center border-b border-white/5 last:border-b-0 hover:bg-white/[0.02] font-mono text-sm">
                <span className="text-[#5A6478]">{String(i + 1).padStart(2, "0")}</span>
                <span className="text-[#E8ECF4] font-sans font-medium truncate">{s.symbol}</span>
                <span className="text-right text-[#8A93A6]">{fmt(s.prevClose)}</span>
                <span className="text-right text-[#E8ECF4]">{fmt(s.ltp)}</span>
                <span className={"text-right " + (up ? "text-[#22C55E]" : "text-[#EF4444]")}>{up ? "+" : ""}{fmt(s.pct)}%</span>
                <span className="pl-2"><MomentumBar pct={s.pct} maxAbs={maxAbsPct} /></span>
              </div>
            );
          })}
        </div>

        <div className="text-xs text-[#5A6478] mt-6 text-center">Momentum = % change of LTP vs previous close. Edit index values above, or upload a CSV to rank your own Nifty 200 list.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MomentumBoard />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
